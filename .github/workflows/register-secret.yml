name: Dummy Workflow to Register Secret

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  dummy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step to "register" the secret safely
      - name: Reference secret safely
        run: |
          if [ -z "${REPO_ACCESS_SECRET}" ]; then
            echo "Secret not set yet"
          else
            echo "Secret is available"
          fi
        env:
          REPO_ACCESS_SECRET: ${{ secrets.REPO_ACCESS_SECRET }}